<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>everycommit demo</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 3rem 1rem; background: #e9eae6; font-family: system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #16181b; } }
  every-commit { width: min(100%, 64rem); }
</style>
<script type="module" src="../widget/every-commit.js"></script>
</head>
<body>
<!-- Serve the repository root (for example `npx serve .`) and open /docs/demo.html?src=/path/to/activity.json -->
<every-commit id="graph"></every-commit>
<script type="module">
  const src = new URLSearchParams(location.search).get('src') ?? '../activity.json';
  const graph = document.getElementById('graph');
  graph.setAttribute('src', src);
  // ?preview=signed shows the badge as it looks on a signed graph, for recording the README demo.
  // It lives only in this docs page, never in the widget, so no embed can switch the badge on.
  if (new URLSearchParams(location.search).get('preview') === 'signed') {
    const timer = setInterval(() => {
      const seal = graph.shadowRoot?.querySelector('.seal');
      if (!seal) return;
      clearInterval(timer);
      seal.classList.add('signed');
      seal.querySelector('b').textContent = '\u2713 Verified';
      seal.querySelector('.sig').textContent = 'Signed';
    }, 50);
  }
</script>
</body>
</html>
